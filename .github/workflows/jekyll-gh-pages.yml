# Calendar Queen: build and deploy the static website, including generated feeds.
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Refresh the culture calendar every Monday; the moon feed is safely regenerated at the same time.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Set up Python for feed generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test feed generators
        run: python -m unittest discover -s .github/scripts -p "test_*.py"
      - name: Generate the rolling moon-phase calendar
        run: python .github/scripts/generate_moon_phases.py
      - name: Generate Berlin culture calendar when source access is configured
        env:
          BERLIN_BUEHNEN_ICS_URL: ${{ secrets.BERLIN_BUEHNEN_ICS_URL }}
          MUSEUMSPORTAL_ICS_URL: ${{ secrets.MUSEUMSPORTAL_ICS_URL }}
        run: python .github/scripts/generate_berlin_culture.py
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Ensure Umami tracking is present
        run: |
          sudo chmod -R a+rwX _site
          python - <<'PY'
          from pathlib import Path

          tracking = '<script defer src="https://cloud.umami.is/script.js" data-website-id="1aa6d07c-5011-4c9c-b3e8-731eb8e1c49c"></script>'

          for path in Path('_site').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'data-website-id="1aa6d07c-5011-4c9c-b3e8-731eb8e1c49c"' in text:
                  continue
              if '</head>' in text:
                  path.write_text(text.replace('</head>', f'{tracking}\n</head>', 1), encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
