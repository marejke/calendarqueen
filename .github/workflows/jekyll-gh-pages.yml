# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Add Umami tracking to all HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path

          tracking = '<script defer src="https://cloud.umami.is/script.js" data-website-id="1aa6d07c-5011-4c9c-b3e8-731eb8e1c49c"></script>'

          for path in Path('_site').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'data-website-id="1aa6d07c-5011-4c9c-b3e8-731eb8e1c49c"' in text:
                  continue
              if '</head>' in text:
                  text = text.replace('</head>', f'{tracking}\n</head>', 1)
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5